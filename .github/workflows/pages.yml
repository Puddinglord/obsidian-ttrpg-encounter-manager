name: Deploy landing page

# Builds the landing page and its live demo (scripts/build-site.mjs) and publishes it to GitHub Pages.
# The demo runs the plugin's own code, so plugin changes redeploy it too.
# One-time setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "demo/**"
      - "src/**"
      - "styles.css"
      - "sample-vault/**"
      - "docs/**"
      - "scripts/build-site.mjs"
      - "scripts/build-docs.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build the site and live demo
        run: node scripts/build-site.mjs && touch _site/.nojekyll

      - name: Package the sample adventure
        # The sample vault with the latest released plugin installed, served at
        # <site>/Ember-Vault-Sample-Adventure.zip. The release workflow re-runs this after each release.
        run: |
          if gh release download --pattern main.js --pattern manifest.json --pattern styles.css --dir release --clobber; then
            cp release/main.js release/manifest.json release/styles.css .
            node scripts/package-sample-vault.mjs _site
          else
            echo "No release yet; skipping the sample adventure."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
