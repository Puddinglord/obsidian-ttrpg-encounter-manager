name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # Build provenance attestations for the release files.
  id-token: write
  attestations: write
  # Redeploys the landing page, which hosts the sample adventure.
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG doesn't match manifest.json version $VERSION (Obsidian needs them identical, no 'v')"
            exit 1
          fi
          node -e "const v=require('./versions.json'); if(!v['$VERSION']) { console.error('versions.json has no entry for $VERSION'); process.exit(1) }"

      - name: Lint (Obsidian review rules)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f main.js ]; then
            echo "Error: main.js was not created by the build step"
            exit 1
          fi
          ls -la main.js manifest.json styles.css

      - name: Attest build provenance
        # Lets anyone check these files were built from this repo by this workflow:
        # gh attestation verify main.js --repo ${{ github.repository }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create Release
        # Only the files Obsidian installs. The sample adventure is on the landing page.
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css

      - name: Refresh the landing page
        # Rebuilds the sample adventure download with this release's plugin.
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
