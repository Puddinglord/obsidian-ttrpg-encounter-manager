name: Auto release

# Every PR merged into main ships a release. The PR's labels pick the bump:
#   release: major   1.2.3 -> 2.0.0
#   release: minor   1.2.3 -> 1.3.0
#   (no label)       1.2.3 -> 1.2.4
#   release: skip    no release
# If the PR already set a new version in manifest.json that has no tag yet, that version ships as is.
#
# This bumps package.json, manifest.json and versions.json, commits to main, tags, and then runs
# release.yml for the tag. (A tag pushed with the workflow token doesn't trigger workflows by itself.)

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write

# One release at a time, in merge order.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: "github.event.pull_request.merged && !contains(github.event.pull_request.labels.*.name, 'release: skip')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Work out the version
        id: version
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          CURRENT=$(node -p "require('./manifest.json').version")
          if [ -z "$(git tag -l "$CURRENT")" ]; then
            echo "manifest.json is at $CURRENT, which isn't tagged yet: releasing it as is."
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BUMP="patch"
          if echo "$LABELS" | grep -q '"release: minor"'; then BUMP="minor"; fi
          if echo "$LABELS" | grep -q '"release: major"'; then BUMP="major"; fi
          IFS=. read -r MAJ MIN PAT <<< "$CURRENT"
          case "$BUMP" in
            major) NEXT="$((MAJ + 1)).0.0" ;;
            minor) NEXT="$MAJ.$((MIN + 1)).0" ;;
            *)     NEXT="$MAJ.$MIN.$((PAT + 1))" ;;
          esac
          if [ -n "$(git tag -l "$NEXT")" ]; then echo "Tag $NEXT already exists"; exit 1; fi
          echo "$BUMP bump: $CURRENT -> $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      - name: Bump, commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUMPED: ${{ steps.version.outputs.bumped }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$BUMPED" = "true" ]; then
            # Runs version-bump.mjs too: manifest.json and versions.json follow package.json.
            npm version "$VERSION" --no-git-tag-version
            git add package.json package-lock.json manifest.json versions.json
            git commit -m "🔖 Release $VERSION (#$PR)"
            git push origin main
          fi
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Run the release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run release.yml --ref "$VERSION"
