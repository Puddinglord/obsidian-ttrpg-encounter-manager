<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encounter manager: a design system per game</title>
<style>
/* ==========================================================================
   Page chrome (neutral, so each game's system stands on its own)
   ========================================================================== */
:root {
	--page: #f4f4f1; --surface: #ffffff; --ink: #141414; --ink-2: #55534e; --muted: #8b8984; --line: #e3e2dc;
	color-scheme: light;
}
.dark:root, :root.dark { --page: #0f0f0e; --surface: #191918; --ink: #f0efea; --ink-2: #bdbbb3; --muted: #84827b; --line: #2b2a27; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.page-head { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.page-head-in { max-width: 1440px; margin: 0 auto; padding: 14px 28px 0; }
.page-title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.page-title h1 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
.page-title p { margin: 0; color: var(--ink-2); font-size: 13px; }
.page-title .spacer { flex: 1; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.toggle button { font: inherit; font-size: 12px; border: 0; background: none; color: var(--ink-2); padding: 4px 12px; cursor: pointer; }
.toggle button.on { background: var(--ink); color: var(--page); }
.tabs { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
.tabs button { font: inherit; font-size: 13px; font-weight: 600; border: 0; background: none; color: var(--ink-2); padding: 8px 14px 10px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
main { max-width: 1440px; margin: 0 auto; padding: 26px 28px 80px; }
section.view { display: none; }
section.view.on { display: block; }
h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 34px 0 12px; font-weight: 700; }
.lede { max-width: 860px; color: var(--ink-2); font-size: 15px; margin: 0 0 6px; }
.lede b { color: var(--ink); }

/* Overview: anatomy and principles */
.anatomy { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.slots { display: grid; grid-template-columns: 96px minmax(0, 1fr) 28px; gap: 6px; font-size: 12px; }
.slot { border: 1.5px dashed var(--muted); border-radius: 8px; padding: 8px 10px; color: var(--ink-2); background: color-mix(in srgb, var(--ink) 3%, transparent); }
.slot b { display: block; color: var(--ink); font-size: 12px; }
.slot.wide { grid-column: 2 / 4; }
.slot.full { grid-column: 1 / -1; }
.slot.tall { grid-row: span 3; display: flex; flex-direction: column; justify-content: center; text-align: center; }
.principles { margin: 0; padding-left: 18px; color: var(--ink-2); }
.principles li { margin: 0 0 8px; }
.principles b { color: var(--ink); }
table.matrix { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 13px; }
table.matrix th, table.matrix td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
table.matrix th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: color-mix(in srgb, var(--ink) 3%, var(--surface)); }
table.matrix td:first-child { font-weight: 650; white-space: nowrap; }
table.matrix tr:last-child td { border-bottom: 0; }
.tokgrid { display: grid; grid-template-columns: 160px repeat(7, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 12px; }
.tokgrid > div { padding: 8px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; min-width: 0; }
.tokgrid .h { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; background: color-mix(in srgb, var(--ink) 3%, var(--surface)); }
.tokgrid code { font: 11px Menlo, monospace; color: var(--ink-2); }
.sw { width: 22px; height: 22px; border-radius: 6px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); }

/* A game's page: the system sheet beside the panel */
.game-hero { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
.game-hero h2 { margin: 0; font-size: 30px; letter-spacing: -0.01em; }
.game-hero .tag { color: var(--ink-2); font-size: 15px; }
.words { display: flex; gap: 6px; flex-wrap: wrap; }
.words span { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--ink-2); background: var(--surface); }
.dirs { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 18px; }
.dirs button { font: inherit; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 10px 14px; cursor: pointer; min-width: 220px; }
.dirs button small { display: block; color: var(--ink-2); font-size: 12px; margin-top: 2px; }
.dirs button.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.game-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 28px; align-items: start; }
.game-grid .stage { position: sticky; top: 110px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.stage-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; align-self: flex-start; margin-left: 20px; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; }
.sheet h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 22px 0 10px; }
.sheet h3:first-child { margin-top: 0; }
.concept { font-size: 15px; color: var(--ink-2); margin: 0; max-width: 680px; }
.concept b { color: var(--ink); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.swatch { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.swatch .chip { height: 46px; }
.swatch .lbl { padding: 6px 8px; font-size: 11px; line-height: 1.3; }
.swatch .lbl b { display: block; font-size: 12px; color: var(--ink); }
.swatch .lbl code { font: 10.5px Menlo, monospace; color: var(--muted); }
.typo { display: grid; gap: 10px; }
.typo .row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; align-items: baseline; }
.typo .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.typo .k small { display: block; text-transform: none; letter-spacing: 0; font-family: Menlo, monospace; font-size: 10px; }
.notes { margin: 0; padding-left: 18px; color: var(--ink-2); }
.notes li { margin-bottom: 6px; }
.notes b { color: var(--ink); }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data td:first-child { width: 150px; color: var(--muted); font-size: 12px; padding-right: 12px; }
table.data tr:last-child td { border-bottom: 0; }
.components { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; padding: 16px; border-radius: 12px; }

/* Side by side */
.lineup { display: flex; gap: 22px; overflow-x: auto; padding: 6px 4px 24px; align-items: flex-start; }
.lineup figure { margin: 0; display: flex; flex-direction: column; gap: 10px; flex: none; }
.lineup figcaption { font-size: 12px; font-weight: 700; color: var(--ink-2); padding-left: 4px; }

/* The fake Obsidian sidebar the panel sits in */
.sidebar { width: 360px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 18px 50px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.05); }
.sidebar.narrow { width: 300px; }
.sidebar-tabs { display: flex; gap: 14px; padding: 9px 14px; background: var(--surface); border-bottom: 1px solid var(--line); color: var(--muted); }
.sidebar-tabs i { width: 14px; height: 14px; border-radius: 4px; background: currentColor; opacity: 0.35; display: block; }
.sidebar-tabs i.on { opacity: 0.9; }

/* ==========================================================================
   THE SHARED BUILDING BLOCKS
   Every game's panel is the same markup (renderPanel below): head, economy,
   controls, groups of rows, each row = order · identity · defense · tracks ·
   resources · conditions. A game's system is tokens plus a few shape rules.
   ========================================================================== */
.ep {
	--r: 10px; --row-gap: 8px;
	font-family: var(--ui); color: var(--ink); background: var(--panel);
	padding: 14px 14px 18px; min-height: 640px;
}
.ep svg, .components svg { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ep-head { display: flex; align-items: flex-start; gap: 8px; }
.ep-titles { flex: 1; min-width: 0; }
.ep-title { font-family: var(--display); font-variant: var(--display-variant, normal); text-transform: var(--display-case, none); letter-spacing: var(--display-track, 0); font-weight: var(--display-weight, 700); font-size: var(--title-size, 20px); line-height: 1.1; color: var(--title-ink, var(--ink)); }
.ep-sub { margin-top: 3px; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ep-sub b { color: var(--ink); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px; }
.ep-icon { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--muted); font-size: 16px; }
.ep-rule { height: var(--rule-h, 2px); margin: 10px 0 12px; background: var(--rule-bg, linear-gradient(90deg, var(--accent), transparent)); border-radius: 2px; }
.ep-econ { margin: -2px 0 12px; }
.ep-controls { display: flex; gap: 6px; margin-bottom: 14px; }
.ep-btn { font: inherit; font-size: 13px; font-weight: 650; height: 36px; white-space: nowrap; overflow: hidden; min-width: 0; padding: 0 12px; border-radius: var(--btn-r, 9px); border: 1px solid var(--card-edge); background: var(--card); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; }
.ep-btn.icon { width: 36px; padding: 0; flex: none; font-size: 16px; }
.sidebar.narrow .ep-btn.primary { font-size: 12.5px; }
.ep-btn.primary { flex: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-size: 14px; box-shadow: var(--primary-shadow, none); }
.ep-btn.primary svg { font-size: 15px; }
.ep-group { display: flex; align-items: center; gap: 8px; margin: 14px 0 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.ep-group::after { content: ""; flex: 1; height: 1px; background: var(--card-edge); }
.ep-group .n { font-weight: 600; letter-spacing: 0; text-transform: none; }
.ep-list { display: flex; flex-direction: column; gap: var(--row-gap); }

.ep-row { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 10px 10px 10px; border-radius: var(--r); background: var(--card); border: 1px solid var(--card-edge); box-shadow: var(--card-shadow, none); }
.ep-row::before { content: ""; position: absolute; left: -1px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--side); }
.ep-row.hero { --side: var(--hero); }
.ep-row.foe { --side: var(--foe); }
.ep-row.is-current { background: var(--current-bg); border-color: var(--current-edge); box-shadow: var(--current-shadow, none); }
.ep-row.is-out { opacity: 0.5; }
.ep-row.is-done .ep-name { opacity: 0.55; }
.ep-flag { position: absolute; top: -9px; left: 12px; font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; background: var(--accent); color: var(--on-accent); }
.ep-order { width: 38px; height: 38px; border-radius: 9px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid var(--card-edge); background: var(--order-bg, var(--panel)); font-family: var(--num); font-weight: 700; font-size: 17px; line-height: 1; color: var(--ink); }
.ep-order small { font-size: 8.5px; letter-spacing: 0.06em; color: var(--muted); font-family: var(--ui); margin-top: 2px; font-weight: 700; }
.is-current .ep-order { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.is-current .ep-order small { color: color-mix(in srgb, var(--on-accent) 75%, transparent); }
.ep-main { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ep-l1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ep-name { font-family: var(--display); font-variant: var(--display-variant, normal); text-transform: var(--name-case, none); letter-spacing: var(--name-track, 0); font-weight: var(--display-weight, 700); font-size: var(--name-size, 15px); line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ep-meta { font-size: 11px; color: var(--muted); white-space: nowrap; }
.ep-more { margin-left: auto; color: var(--muted); font-size: 14px; display: inline-flex; }
.ep-l2 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ep-track { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ep-track .lab { display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.ep-bar { height: var(--bar-h, 7px); border-radius: 99px; background: var(--track); overflow: hidden; display: flex; }
.ep-bar i { display: block; height: 100%; background: var(--fill, var(--good)); border-radius: 99px; }
.ep-bar i.temp { background: var(--temp, #3fb6b0); border-radius: 0 99px 99px 0; }
.ep-num { font-family: var(--num); font-weight: 700; font-size: 14px; padding: 4px 8px; border-radius: 7px; border: 1px solid var(--card-edge); background: var(--num-bg, var(--panel)); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ep-num .max { color: var(--muted); font-weight: 600; }
.ep-num .tmp { color: var(--temp, #3fb6b0); font-size: 11px; margin-left: 3px; }
.ep-num.low { color: var(--bad); }
.ep-def { display: inline-flex; align-items: center; justify-content: center; flex: none; position: relative; font-family: var(--num); font-weight: 800; font-size: 12px; color: var(--ink); }
.ep-def.shield { width: 31px; height: 35px; font-size: 12.5px; }
.ep-def.shield svg { position: absolute; inset: 0; width: 100%; height: 100%; stroke: var(--ornament); fill: var(--def-fill, color-mix(in srgb, var(--ornament) 14%, var(--card))); stroke-width: 1.4; }
.ep-def.shield span { position: relative; top: -2px; letter-spacing: -0.02em; }
.ep-def.label { gap: 4px; padding: 3px 7px; border-radius: 6px; border: 1px solid var(--card-edge); font-size: 11px; background: var(--panel); }
.ep-def.label em { font-style: normal; font-weight: 700; color: var(--muted); font-size: 9.5px; letter-spacing: 0.06em; font-family: var(--ui); }
.ep-res { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.ep-pips { display: inline-flex; align-items: center; gap: 4px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.ep-pips .p { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--pip, var(--ornament)); }
.ep-pips .p.on { background: var(--pip, var(--ornament)); }
.ep-pips.sq .p { border-radius: 3px; }
.ep-pips.dia .p { border-radius: 2px; transform: rotate(45deg) scale(0.85); }
.ep-conds { display: flex; flex-wrap: wrap; gap: 5px; }
.ep-cond { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 650; padding: 2px 8px; border-radius: var(--chip-r, 99px); background: var(--chip-bg, color-mix(in srgb, var(--warn) 16%, var(--card))); color: var(--chip-ink, color-mix(in srgb, var(--warn) 80%, var(--ink))); border: 1px solid var(--chip-edge, color-mix(in srgb, var(--warn) 35%, transparent)); white-space: nowrap; }
.ep-cond svg { font-size: 11px; }
.ep-cond .v { font-family: var(--num); font-size: 10.5px; padding: 0 5px; border-radius: 99px; background: color-mix(in srgb, currentColor 16%, transparent); }
.ep-cond .x { opacity: 0.55; font-size: 12px; }
.ep-cond.good { --chip-bg: color-mix(in srgb, var(--hero) 14%, var(--card)); --chip-ink: color-mix(in srgb, var(--hero) 80%, var(--ink)); --chip-edge: color-mix(in srgb, var(--hero) 35%, transparent); }
.ep-cond.bad { --chip-bg: color-mix(in srgb, var(--bad) 14%, var(--card)); --chip-ink: color-mix(in srgb, var(--bad) 85%, var(--ink)); --chip-edge: color-mix(in srgb, var(--bad) 35%, transparent); }
.ep-cond.add { background: none; border-style: dashed; color: var(--muted); border-color: var(--card-edge); }
.ep-prompt { margin-top: 16px; border-radius: 12px; border: 1px solid var(--card-edge); background: var(--card); padding: 12px; box-shadow: var(--card-shadow, none); }
.ep-prompt .ph { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.ep-prompt .pt { font-weight: 700; display: flex; gap: 7px; align-items: center; }
.ep-prompt .pt .who { font-family: var(--display); font-variant: var(--display-variant, normal); text-transform: var(--name-case, none); }
.ep-prompt .pt .what { color: var(--accent-text); }
.ep-prompt .pd { font-size: 12.5px; color: var(--muted); margin: 3px 0 9px; }
.ep-prompt .pb { display: flex; gap: 6px; flex-wrap: wrap; }
.ep-prompt .ep-btn { height: 30px; font-size: 12.5px; }
.ep-prompt .ep-btn.primary { flex: none; }
.ep-fold { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.ep-fold::after { content: ""; flex: 1; height: 1px; background: var(--card-edge); }

/* Economy strips (game-specific content, shared look) */
.econ { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--card); border: 1px solid var(--card-edge); font-size: 12px; }
.econ .k { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.econ .gems { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.econ .gem { width: 12px; height: 12px; border-radius: 3px; transform: rotate(45deg) scale(0.8); border: 1.5px solid var(--fear); }
.econ .gem.on { background: var(--fear); box-shadow: 0 0 8px color-mix(in srgb, var(--fear) 60%, transparent); }
.seg { display: flex; border-radius: 10px; overflow: hidden; border: 1px solid var(--card-edge); background: var(--card); }
.seg div { flex: 1; padding: 7px 10px; font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; color: var(--muted); }
.seg div.on { background: var(--seg-on, var(--hero)); color: #fff; }
.seg div.on.foe { background: var(--foe); }
.seg div small { font-weight: 600; opacity: 0.85; }

/* Slot tracks (Daggerheart HP and Stress, CoC boxes) */
.slots-row { display: inline-flex; align-items: center; gap: 3px; }
.slots-row .s { width: 11px; height: 14px; border-radius: 3px; border: 1.5px solid var(--slot, var(--bad)); }
.slots-row .s.on { background: var(--slot, var(--bad)); }
.slots-row .k { font-size: 9.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-right: 4px; min-width: 22px; }

/* ==========================================================================
   GAME SYSTEMS: tokens (set from JS, light and dark) + the few shape rules
   that make each one its own. Nothing below adds markup.
   ========================================================================== */

/* ---------- 5e A · Illuminated: the SRD's book, refined ---------- */
.sys-5e-a .ep-row { --r: 6px; }
.sys-5e-a .ep-row::before { width: 2px; top: 6px; bottom: 6px; }
.sys-5e-a .ep-order { border-radius: 50%; border-color: var(--ornament); font-family: var(--display); font-size: 16px; }
.sys-5e-a .ep-title::after { content: ""; }
.sys-5e-a .ep-rule { --rule-h: 1px; --rule-bg: linear-gradient(90deg, var(--ornament), color-mix(in srgb, var(--ornament) 20%, transparent)); position: relative; }
.sys-5e-a .ep-rule::after { content: ""; position: absolute; left: 0; top: -3px; width: 7px; height: 7px; transform: rotate(45deg); background: var(--ornament); }
.sys-5e-a .ep-cond { --chip-r: 4px; font-variant: small-caps; letter-spacing: 0.03em; font-size: 12.5px; }
.sys-5e-a .ep-btn.primary { font-family: var(--display); font-variant: small-caps; font-size: 16px; letter-spacing: 0.04em; }

/* ---------- 5e B · Grimoire: dark-first, candlelit ---------- */
.sys-5e-b .ep { background: radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%), var(--panel); }
.sys-5e-b .ep-row { --r: 12px; background: linear-gradient(180deg, color-mix(in srgb, var(--ink) 4%, var(--card)), var(--card)); }
.sys-5e-b .ep-row::before { display: none; }
.sys-5e-b .ep-row .ep-order { border-radius: 10px; box-shadow: inset 0 -2px 0 var(--side); }
.sys-5e-b .ep-row.is-current { box-shadow: 0 0 0 1px var(--accent), 0 0 24px color-mix(in srgb, var(--accent) 30%, transparent); }
.sys-5e-b .ep-bar { box-shadow: inset 0 1px 2px rgba(0,0,0,0.35); }

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hpFill(cur, max) { const r = max ? cur / max : 0; return r <= 0.25 ? 'var(--bad)' : r <= 0.5 ? 'var(--warn)' : 'var(--good)'; }
function track(t) {
	if (t.kind === 'slots') {
		const marked = t.marked ? t.cur : t.max - t.cur; // CoC counts HP left; Daggerheart marks damage taken
		const max = t.max > 14 ? 14 : t.max;
		const on = t.marked ? Math.min(marked, max) : Math.round((t.cur / t.max) * max);
		return `<span class="slots-row" style="${t.slot ? `--slot:${t.slot}` : ''}"><span class="k">${esc(t.label ?? '')}</span>${Array.from({ length: max }, (_, i) => `<i class="s${i < on ? ' on' : ''}"></i>`).join('')}${t.marked ? '' : `<b style="font-family:var(--num);font-size:12px;margin-left:6px">${t.cur}<span style="color:var(--muted)">/${t.max}</span></b>`}</span>`;
	}
	const pct = Math.max(0, Math.min(100, (t.cur / t.max) * 100));
	const tmp = t.temp ? Math.min(100 - pct, (t.temp / t.max) * 100) : 0;
	return `<div class="ep-track">${t.label ? `<div class="lab"><span>${esc(t.label)}</span><span>${t.cur}/${t.max}</span></div>` : ''}<div class="ep-bar"><i style="width:${pct}%;--fill:${t.fill ?? hpFill(t.cur, t.max)}"></i>${tmp ? `<i class="temp" style="width:${tmp}%"></i>` : ''}</div></div>`;
}
function defense(d) {

	return `<span class="ep-def label"><em>${esc(d.label)}</em>${esc(d.value)}</span>`;
}

}
function cond(c) {

	const hp = bars[0] && !bars[0].label;
	const num = hp ? `<span class="ep-num${bars[0].cur / bars[0].max <= 0.25 ? ' low' : ''}">${bars[0].cur}<span class="max">/${bars[0].max}</span>${bars[0].temp ? `<span class="tmp">+${bars[0].temp}</span>` : ''}</span>` : '';
	const order = `<div class="ep-order">${esc(c.order.value)}${c.order.label ? `<small>${esc(c.order.label)}</small>` : ''}</div>`;
	return `<div class="ep-row ${c.side}${c.current ? ' is-current' : ''}${c.done ? ' is-done' : ''}${c.out ? ' is-out' : ''}">
		${c.current ? '<span class="ep-flag">Up now</span>' : ''}
		${order}
		<div class="ep-main">
			<div class="ep-l1"><span class="ep-name">${esc(c.name)}</span>${c.meta ? `<span class="ep-meta">${esc(c.meta)}</span>` : ''}<span class="ep-more">${ico('more')}</span></div>

let theme = 'light';
function styleFor(sysKey) {
	const s = SYSTEMS[sysKey];
	const t = { ...s[theme] };
	const vars = Object.entries(t).map(([k, v]) => `--${k}:${v}`);
	vars.push(`--display:${s.fonts.display}`, `--ui:${s.fonts.ui}`, `--num:${s.fonts.num}`);
	for (const [k, v] of Object.entries(s.type ?? {})) vars.push(`--${k}:${v}`);
	return vars.join(';');
}
function frame(sysKey, gameKey, narrow = false) {
	return `<div class="sidebar${narrow ? ' narrow' : ''} sys-${sysKey}" style="${esc(styleFor(sysKey))}"><div class="sidebar-tabs" style="background:var(--panel);border-color:var(--card-edge);color:var(--muted)"><i></i><i></i><i></i><i class="on"></i></div>${renderPanel(gameKey)}</div>`;
}

		concept: 'There\'s no initiative: the spotlight passes between players, and the GM spends Fear to take it. So the top of the panel is the Fear gems and countdowns, the current card glows gold, and the main button passes the spotlight. HP and Stress are slots you mark, with damage thresholds beside them.',
		turn: 'Spotlight: players act until a roll goes with Fear or the GM spends Fear', order: 'None (who has the spotlight)', defense: 'Evasion (PCs), Difficulty (adversaries)', tracks: 'HP slots and Stress slots, marked; damage thresholds Major / Severe', res: 'Hope per PC (6), armor slots; the GM\'s Fear (12); countdowns', conds: 'Restrained, Vulnerable, Hidden; temporary tags', prompts: 'Spend Fear for the spotlight, countdowns ticking, Stress to avoid',
		notes: ['The turn model is the biggest departure: the shared "current" state means "has the spotlight", and Next becomes "Pass the spotlight".', 'Slots need a second track kind (marked damage) next to bars; the shared row already takes it.', 'Thresholds sit beside HP so the GM can turn damage into marks without the rulebook.'],
	},
	pf: {
		words: ['Exact', 'Heraldic', 'Three actions'],
		concept: 'Pathfinder runs on the three-action economy and numbered conditions. Each row shows the actions left as diamonds and the reaction as a pip; conditions carry their value in a solid block (FRIGHTENED 1, DYING 1). Initiative is usually Perception.',
		turn: 'Initiative (Perception, or a skill), highest first', order: 'Initiative', defense: 'AC; Fort, Ref, Will on the quick look', tracks: 'HP; Dying and Wounded as valued conditions', res: 'Three actions and a reaction each turn', conds: 'Valued conditions (Frightened 2, Clumsy 1) that tick down; persistent damage', prompts: 'Persistent damage then a DC 15 flat check; Frightened dropping by 1 at end of turn; recovery checks while dying',
		notes: ['Valued conditions map straight onto the shared condition (name + value) and timed conditions (Frightened ticks down at the end of its turn).', 'Persistent damage is exactly the timed-conditions engine: damage at end of turn, then a flat check that ends it.'],
	},
};

function swatches(sysKey) {
	const s = SYSTEMS[sysKey][theme];
	return `<div class="swatches">${TOKEN_DOCS.filter(([k]) => s[k]).map(([k, d]) => `<div class="swatch"><div class="chip" style="background:${s[k]}"></div><div class="lbl"><b>${esc(d)}</b><code>--${k} ${esc(s[k])}</code></div></div>`).join('')}</div>`;
}
function typeSpecimen(sysKey) {
	const s = SYSTEMS[sysKey];
	const t = s.type ?? {};
	const disp = `font-family:${s.fonts.display};font-weight:${t['display-weight'] ?? 700};font-variant:${t['display-variant'] ?? 'normal'};text-transform:${t['display-case'] ?? 'none'};letter-spacing:${t['display-track'] ?? 0}`;
	return `<div class="typo">
		<div class="row"><div class="k">Display<small>${esc(s.fonts.display.split(',')[0])}</small></div><div style="${esc(disp)};font-size:28px;line-height:1.1">Road ambush · Ogre</div></div>
		<div class="row"><div class="k">Interface<small>${esc(s.fonts.ui.split(',')[0])}</small></div><div style="font-family:${esc(s.fonts.ui)};font-size:15px">Round 2 · Goblin Warrior's turn. Frightened, 2 rounds.</div></div>
		<div class="row"><div class="k">Numbers<small>${esc(s.fonts.num.split(',')[0])}</small></div><div style="font-family:${esc(s.fonts.num)};font-size:24px;font-weight:700;font-variant-numeric:tabular-nums">19 · 41/68 · 110/178 · +5</div></div>
	</div>`;
}
function components(sysKey) {
	return `<div class="components sys-${sysKey}" style="${esc(styleFor(sysKey))};background:var(--panel);font-family:var(--ui);color:var(--ink)">
		<button class="ep-btn primary" style="flex:none">${ico('skip')}Next turn</button>
		<button class="ep-btn">${ico('back')}Back</button>
		<span class="ep-def shield">${ico('heater')}<span>15</span></span>
		<span class="ep-def label"><em>Armor</em>Medium</span>
		<span class="ep-order" style="display:inline-flex">17</span>
		${cond({ name: 'Frightened', rounds: 2 })}${cond({ name: 'Burning', icon: 'flame', tone: 'bad' })}${cond({ name: 'Blessed', tone: 'good' })}
		${pips({ label: 'Actions', on: 2, max: 3 })}
		<span style="width:150px">${track({ kind: 'bar', cur: 22, max: 32, temp: 4 })}</span>
		${track({ kind: 'slots', label: 'HP', cur: 2, max: 6, marked: true })}
	</div>`;
}
function gamePage(g) {
	const d = DATA[g.id];
	const sysKey = g.systems[g.dir ?? 0];
	const s = SYSTEMS[sysKey];
	return `<div class="game-hero"><h2>${esc(s.game)}</h2><span class="tag">${esc(s.label)}</span><div class="words">${d.words.map(w => `<span>${esc(w)}</span>`).join('')}</div></div>
	${g.systems.length > 1 ? `<div class="dirs">${g.systems.map((k, i) => `<button data-dir="${i}" class="${i === (g.dir ?? 0) ? 'on' : ''}">${String.fromCharCode(65 + i)} · ${esc(SYSTEMS[k].label)}<small>${esc(SYSTEMS[k].pitch.split('.')[0])}.</small></button>`).join('')}</div>` : ''}
	<div class="game-grid">
		<div class="sheet">
			<h3>The idea</h3>
			<p class="concept">${d.concept}</p>
			<p class="concept" style="margin-top:10px"><b>${esc(s.label)}:</b> ${esc(s.pitch)}</p>
			<h3>Colour</h3>${swatches(sysKey)}
			<h3>Type</h3>${typeSpecimen(sysKey)}
			<h3>Pieces</h3>${components(sysKey)}
			<h3>What this game puts in the shared shape</h3>
			<table class="data">
				<tr><td>Turn model</td><td>${esc(d.turn)}</td></tr>
				<tr><td>Order</td><td>${esc(d.order)}</td></tr>
				<tr><td>Defense</td><td>${esc(d.defense)}</td></tr>
				<tr><td>Tracks</td><td>${esc(d.tracks)}</td></tr>
				<tr><td>Resources (pips)</td><td>${esc(d.res)}</td></tr>
				<tr><td>Conditions</td><td>${esc(d.conds)}</td></tr>
				<tr><td>Turn prompts</td><td>${esc(d.prompts)}</td></tr>
			</table>
			<h3>Notes</h3><ul class="notes">${d.notes.map(n => `<li>${n}</li>`).join('')}</ul>
		</div>
		<div class="stage"><div class="stage-label">Sidebar · 360px</div>${frame(sysKey, g.enc)}<div class="stage-label">Narrow · 300px</div>${frame(sysKey, g.enc, true)}</div>
	</div>`;
}
function overview() {
	const cols = ['5e-a', '5e-b', '5e-c', 'nimble', 'coc', 'dh', 'pf'];
	const tokRows = ['panel', 'card', 'accent', 'ornament', 'hero', 'foe', 'bad'];
	return `<p class="lede">An encounter panel is the same <b>six parts</b> in every game. What changes is <b>the data in each part</b> (initiative or DEX or the spotlight; AC or Evasion; HP bars or marked slots) and <b>the design system</b> that draws it. This page proposes one design system per game, all on the same building blocks.</p>
	<h2 class="sec">The shared row</h2>
	<div class="anatomy">
		<div class="slots">
			<div class="slot tall"><b>Order</b>Initiative, DEX, ★ spotlight, or a done circle</div>
			<div class="slot"><b>Identity</b>Name in the game's display type · a short meta line · ⋯ menu</div>
			<div class="slot tall" style="grid-row: span 3"><b>⋯</b></div>
			<div class="slot"><b>Defense + main track</b>AC shield / Armor / Evasion · HP bar or slots · the number (opens the keypad)</div>
			<div class="slot"><b>Resources</b>Pips: actions, legendary, Hope, Wounds, death saves, Luck</div>
			<div class="slot full"><b>Conditions</b>Chips with a value or rounds left; a mark when they do something each turn (timed conditions engine)</div>
		</div>
		<ul class="principles">
			<li><b>One renderer, many games.</b> The panels on every page are drawn by the same function from each game's data. If a game needs a new kind of thing, it becomes a new <i>kind</i> in the shared shape (Daggerheart added "marked slots"), never a second panel.</li>
			<li><b>A system is tokens plus a few shape rules.</b> Colour, type, surfaces and ornament are tokens (the <code>--ev-*</code> set in styles.css grows to this list). Shape rules are small: a corner radius, where the side colour sits, whether rows are cards or a table.</li>
			<li><b>The turn model shows up top.</b> The header and the "economy" strip are where games differ most: round and turn (5e, PF), sides (Nimble), DEX with readied guns (CoC), Fear and countdowns (Daggerheart).</li>
			<li><b>Same rules everywhere:</b> one main button that says what comes next, the current creature marked twice (colour and a label), numbers in a font that lines up, conditions under the name.</li>
		</ul>
	</div>
	<h2 class="sec">Tokens, per system (${theme})</h2>
	<div class="tokgrid">
		<div class="h">Token</div>${cols.map(k => `<div class="h">${esc(SYSTEMS[k].game)} · ${esc(SYSTEMS[k].label)}</div>`).join('')}
		${tokRows.map(t => `<div><code>--${t}</code></div>${cols.map(k => `<div><span class="sw" style="background:${SYSTEMS[k][theme][t]}"></span><code>${esc(SYSTEMS[k][theme][t])}</code></div>`).join('')}`).join('')}
		<div><code>--display</code></div>${cols.map(k => `<div style="font-family:${esc(SYSTEMS[k].fonts.display)};font-weight:700;font-variant:${SYSTEMS[k].type['display-variant'] ?? 'normal'};text-transform:${SYSTEMS[k].type['display-case'] ?? 'none'}">Ogre</div>`).join('')}
	</div>
	<h2 class="sec">How the games differ in the data</h2>
	<table class="matrix">
		<tr><th></th><th>5e</th><th>Nimble</th><th>Call of Cthulhu</th><th>Daggerheart</th><th>Pathfinder 2e</th></tr>
		${['turn', 'order', 'defense', 'tracks', 'res', 'conds', 'prompts'].map(k => `<tr><td>${{ turn: 'Turn model', order: 'Order', defense: 'Defense', tracks: 'Tracks', res: 'Resources', conds: 'Conditions', prompts: 'Turn prompts' }[k]}</td>${['5e', 'nimble', 'coc', 'dh', 'pf'].map(g => `<td>${esc(DATA[g][k])}</td>`).join('')}</tr>`).join('')}
	</table>
	<h2 class="sec">What the shared code would need</h2>
	<ul class="principles" style="max-width:900px">
		<li><b>Track kinds:</b> <code>bar</code> (HP, SAN) and <code>slots</code> (marked damage or boxes). Today trackers draw bars only.</li>
		<li><b>Order kinds:</b> a number with a label (Init, DEX, Perc), a side with a done state (Nimble), or the spotlight (Daggerheart). The drag-to-reorder piece already works for the first.</li>
		<li><b>Defense kinds:</b> a shield with a number, or a labelled value (Armor Medium, Evasion 12, Difficulty 14), plus optional thresholds.</li>
		<li><b>An economy strip</b> under the header that a game fills: sides, Fear and countdowns, readied firearms. One slot, game-owned content.</li>
		<li><b>Tokens</b> beyond today's <code>--ev-*</code>: <code>--hero</code>, <code>--foe</code>, <code>--track</code>, <code>--current-bg</code>, a number font, and per-game extras (<code>--sanity</code>, <code>--hope</code>, <code>--fear</code>).</li>
	</ul>`;
}
function lineup() {
	const items = [['5e-a', '5e', '5e · Illuminated'], ['5e-b', '5e', '5e · Grimoire'], ['5e-c', '5e', '5e · Field Guide'], ['nimble', 'nimble', 'Nimble · Quick Draw'], ['coc', 'coc', 'Call of Cthulhu · Case File'], ['dh', 'dh', 'Daggerheart · Spotlight'], ['pf', 'pf', 'Pathfinder 2e · Strike']];
	return `<p class="lede">Every system at sidebar width, same renderer. Scroll sideways.</p><div class="lineup">${items.map(([s, e, l]) => `<figure><figcaption>${esc(l)}</figcaption>${frame(s, e)}</figure>`).join('')}</div>`;
}

/* ==========================================================================
   App
   ========================================================================== */
let current = 'overview';
const app = document.getElementById('app');
const tabs = document.getElementById('tabs');
function render() {
	tabs.innerHTML = GAMES.map(g => `<button data-id="${g.id}" class="${g.id === current ? 'on' : ''}">${esc(g.tab)}</button>`).join('');
	const g = GAMES.find(x => x.id === current);
	app.innerHTML = `<section class="view on">${g.id === 'overview' ? overview() : g.id === 'lineup' ? lineup() : gamePage(g)}</section>`;
}
tabs.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; current = b.dataset.id; history.replaceState(null, '', `#${current}`); render(); window.scrollTo({ top: 0 }); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (GAMES.some(g => g.id === h)) { current = h; render(); } });
app.addEventListener('click', (e) => { const b = e.target.closest('[data-dir]'); if (!b) return; GAMES.find(x => x.id === current).dir = Number(b.dataset.dir); render(); });
document.getElementById('theme').addEventListener('click', (e) => {
	const b = e.target.closest('button'); if (!b) return;
	theme = b.dataset.t;
	document.documentElement.classList.toggle('dark', theme === 'dark');
	for (const x of document.querySelectorAll('#theme button')) x.classList.toggle('on', x === b);
	render();
});
const hash = location.hash.slice(1);
if (GAMES.some(g => g.id === hash)) current = hash;
render();
</script>
</body>
</html>
