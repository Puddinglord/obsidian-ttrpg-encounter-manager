<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import…: a design study</title>
<!-- Vollkorn is Nimble's name face, EB Garamond 5e's display face; the rest are system fonts with fallbacks. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vollkorn:ital,wght@0,600;0,700;1,700;1,900&family=EB+Garamond:wght@500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ===== Page (the study's own chrome, not the dialog) ===== */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; background: #d9d6d0; color: #24211d; }
.study-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 18px; background: #24211d; color: #f2eee7; }
.study-bar h1 { margin: 0; font: 700 15px/1 -apple-system, sans-serif; letter-spacing: .02em; }
.study-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.study-group > span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .6; margin-right: 4px; }
.study-group button { font: 600 12px/1 -apple-system, sans-serif; padding: 6px 9px; border-radius: 4px; border: 1px solid #4d4840; background: transparent; color: #f2eee7; cursor: pointer; }
.study-group button.on { background: #f2eee7; color: #24211d; border-color: #f2eee7; }
.study-states { padding: 8px 18px; background: #2f2c28; display: flex; flex-wrap: wrap; gap: 4px; position: sticky; top: 48px; z-index: 49; }
.study-states button { font: 500 12px/1 -apple-system, sans-serif; padding: 6px 8px; border-radius: 4px; border: 1px solid #4d4840; background: transparent; color: #e9e3d7; cursor: pointer; }
.study-states button.on { background: #e9e3d7; color: #24211d; }
.study-note { max-width: 1280px; margin: 14px auto 0; padding: 0 18px; font-size: 13px; color: #3a352e; }
.study-note b { font-weight: 700; }
.stage { display: flex; justify-content: center; padding: 18px; }

/* A frame stands in for Obsidian's window: a workspace behind a modal backdrop. */
.frame { position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 20px 50px -20px rgba(0,0,0,.45); background: #f4f1ea; }
.frame.desktop { width: 1280px; height: 860px; }
.frame.window { width: 700px; height: 820px; }
.frame.phone { width: 390px; height: 844px; border-radius: 44px; border: 10px solid #1b1916; }
.frame .ws { position: absolute; inset: 0; padding: 40px 60px; color: #8f8981; font: 15px/1.8 Georgia, serif; }
.frame .ws i { display: block; height: 12px; margin: 14px 0; background: #e2ddd2; border-radius: 3px; }
.frame .backdrop { position: absolute; inset: 0; background: rgba(20, 18, 15, .38); }

/* ===== Game tokens (from styles.css .ev-sys-nimble / .ev-sys-dnd5e) ===== */
.ev-sys-nimble {
	--ev-bg: #EEEBE4; --ev-surface: #FFFEFB; --ev-surface-2: #F6F3EC; --ev-line: #E2DDD2; --ev-line-strong: #C9C2B4;
	--ev-text: #24211D; --ev-text-2: #625C53; --ev-accent: #46423D; --ev-accent-hover: #2F2C28; --ev-on-accent: #FFFFFF;
	--ev-accent-text: #24211D; --ev-now: #F1ECE1; --ev-now-line: #46423D; --ev-danger-text: #B0281B; --ev-danger-bg: #F8E7E2;
	--ev-red: #C8321E; --ev-ok: #3D7A3A; --ev-chip-bg: #E8E3D7; --ev-chip-text: #2B2823; --ev-band: #DDD6C4; --ev-band-text: #3A352E;
	--ev-hp: #C8321E; --ev-ochre: #9A6A1E; --ev-ochre-soft: #F3E8D2;
	--ev-font-display: "Avenir Next Condensed", "Barlow Condensed", "Roboto Condensed", sans-serif; --ev-display-weight: 700; --ev-display-variant: small-caps;
	--ev-font-name: "Vollkorn", "Avenir Next Condensed", Georgia, serif;
	--ev-font-ui: "Avenir Next", "Nunito Sans", -apple-system, sans-serif;
	--ev-font-num: "Avenir Next Condensed", "Barlow Condensed", sans-serif;
	--ev-r-sm: 3px; --ev-r-md: 6px; --ev-r-lg: 10px; --ev-r-chip: 3px; --ev-pad: 12px;
	--ev-rule: transparent; --ev-name-style: italic; --ev-name-weight: 900;
	--ev-code-bg: #FBF9F4;
}
.theme-dark .ev-sys-nimble {
	--ev-bg: #171512; --ev-surface: #211F1B; --ev-surface-2: #2A2723; --ev-line: #35312B; --ev-line-strong: #4D4840;
	--ev-text: #F2EEE7; --ev-text-2: #B5AEA3; --ev-accent: #E9E3D7; --ev-accent-hover: #FFFFFF; --ev-on-accent: #1B1916;
	--ev-accent-text: #F2EEE7; --ev-now: #2E2B26; --ev-chip-bg: #34302A; --ev-chip-text: #F2EEE7; --ev-band: #3A362F; --ev-band-text: #F2EEE7;
	--ev-danger-bg: #3A211A; --ev-danger-text: #F2917C; --ev-code-bg: #1C1A17; --ev-ochre-soft: #3A3020;
}
.ev-sys-dnd5e {
	--ev-bg: #F2EBDD; --ev-surface: #FCF8EF; --ev-surface-2: #EFE6D5; --ev-line: #E3D6BF; --ev-line-strong: #C9B797;
	--ev-text: #24190F; --ev-text-2: #67543F; --ev-accent: #7B1E12; --ev-accent-hover: #63170D; --ev-on-accent: #FFF6EA;
	--ev-accent-text: #6E1A0E; --ev-now: #F7E9DB; --ev-now-line: #D8B49B; --ev-danger-text: #A3241A; --ev-danger-bg: #F5DFD6;
	--ev-red: #A3241A; --ev-ok: #3D6B35; --ev-chip-bg: #EEE3D0; --ev-chip-text: #3A2C1E; --ev-band: #EADFCF; --ev-band-text: #3A2C1E;
	--ev-hp: #A3241A; --ev-ochre: #9C7A2E; --ev-ochre-soft: #F1E6CC; --ev-gold: #9C7A2E;
	--ev-font-display: "EB Garamond", "Iowan Old Style", Garamond, Georgia, serif; --ev-display-weight: 600; --ev-display-variant: small-caps;
	--ev-font-name: "EB Garamond", Georgia, serif; --ev-name-style: normal; --ev-name-weight: 600;
	--ev-font-ui: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
	--ev-font-num: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
	--ev-r-sm: 3px; --ev-r-md: 6px; --ev-r-lg: 8px; --ev-r-chip: 3px; --ev-pad: 14px; --ev-rule: #9C7A2E;
	--ev-code-bg: #FBF6EA;
}
.theme-dark .ev-sys-dnd5e {
	--ev-bg: #17120E; --ev-surface: #221A14; --ev-surface-2: #2C221A; --ev-line: #3A2E23; --ev-line-strong: #5A4733;
	--ev-text: #F1E6D3; --ev-text-2: #B7A48B; --ev-accent: #B4402F; --ev-accent-hover: #C44C3A; --ev-on-accent: #FFF6EA;
	--ev-accent-text: #EBA68E; --ev-now: #2F1E16; --ev-chip-bg: #3A2C20; --ev-chip-text: #F1E6D3; --ev-band: #3A2C20; --ev-band-text: #F1E6D3;
	--ev-danger-bg: #3A211A; --ev-danger-text: #F2917C; --ev-code-bg: #1D1611; --ev-ochre-soft: #3A2E1A;
}
.theme-dark .frame { background: #1e1e1e; }
.theme-dark .frame .ws { color: #5a5650; }
.theme-dark .frame .ws i { background: #2a2a2a; }
.theme-dark .frame .backdrop { background: rgba(0,0,0,.55); }

.ev-import { --evi-check: var(--evi-check-l); --evi-minus: var(--evi-minus-l); }
.theme-dark .ev-sys-nimble.ev-import { --evi-check: var(--evi-check-d); --evi-minus: var(--evi-minus-d); }
/* ===== Icons and the shared pill (core/pill.ts): icon and label on one centre line ===== */
.ic { display: block; width: 1em; height: 1em; fill: currentColor; flex: 0 0 auto; }
.ev-pill { display: inline-flex; align-items: center; justify-content: center; gap: var(--ev-pill-gap, 6px); white-space: nowrap; }
.ev-pill > .ev-pill-icon { display: block; width: var(--ev-pill-icon, 1.1em); height: var(--ev-pill-icon, 1.1em); }
.ev-pill > .ev-pill-icon svg { display: block; width: 100%; height: 100%; }
.ev-pill > .ev-pill-text { line-height: normal; }

/* ===== The dialog (.modal.ev-dialog.ev-import) ===== */
.ev-import {
	position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
	width: min(1080px, 96%); height: min(780px, 92%);
	display: flex; flex-direction: column; overflow: hidden;
	background: var(--ev-surface); color: var(--ev-text); font-family: var(--ev-font-ui);
	border: 1px solid var(--ev-line); border-radius: 12px; box-shadow: 0 24px 60px -18px rgba(0,0,0,.45);
	container: evi / inline-size;
}
.frame.phone .ev-import { left: 0; top: 0; transform: none; width: 100%; height: 100%; border-radius: 34px; border: 0; }
.ev-import button { font-family: inherit; cursor: pointer; }
.ev-import :focus-visible { outline: 2px solid var(--ev-accent); outline-offset: 2px; }

/* Title row: Obsidian's .modal-title and close button, the game's type. */
.ev-import-titlebar { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 18px 22px 12px; }
.frame.phone .ev-import-titlebar { padding: 22px 18px 10px; justify-content: center; position: relative; }
.ev-import-title { margin: 0; font: var(--ev-name-style) var(--ev-name-weight) 24px/1.1 var(--ev-font-name); }
.ev-sys-dnd5e .ev-import-title { font: 600 26px/1.1 var(--ev-font-display); font-variant: small-caps; color: var(--ev-accent-text); }
.ev-import-close { margin-left: auto; width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--ev-text-2); font-size: 20px; }
.frame.phone .ev-import-close { position: absolute; right: 16px; top: 16px; width: 40px; height: 40px; border-radius: 999px; background: var(--ev-surface-2); }
.ev-import-close:hover { background: var(--ev-surface-2); color: var(--ev-text); }

/* ----- Sources: what was given, one chip each (files, pasted text, a link) ----- */
.ev-import-sources { flex: 0 0 auto; display: flex; gap: 8px; align-items: stretch; padding: 0 22px 12px; overflow-x: auto; scrollbar-width: thin; }
.frame.phone .ev-import-sources { padding: 0 16px 10px; }
.ev-import-source { position: relative; flex: 0 0 auto; display: grid; grid-template-columns: auto minmax(0, auto) auto; align-items: center; gap: 8px; height: 44px; max-width: 260px; padding: 0 6px 0 6px; border: 1px solid var(--ev-line); border-radius: var(--ev-r-md); background: var(--ev-surface); color: var(--ev-text); text-align: left; }
.ev-import-source:hover { border-color: var(--ev-line-strong); }
.ev-import-source.is-on { background: var(--ev-now); border-color: var(--ev-accent); }
.ev-import-source-thumb { width: 32px; height: 32px; border-radius: 4px; display: grid; place-items: center; background: var(--ev-surface-2); color: var(--ev-text-2); font-size: 18px; overflow: hidden; }
.ev-import-source-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ev-import-source-text { min-width: 0; display: flex; flex-direction: column; }
.ev-import-source-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
.ev-import-source-meta { font-size: 11.5px; color: var(--ev-text-2); white-space: nowrap; line-height: 1.25; }
.ev-import-source-meta.is-bad { color: var(--ev-danger-text); }
.ev-import-source-remove { width: 24px; height: 24px; display: grid; place-items: center; border: 0; border-radius: 4px; background: transparent; color: var(--ev-text-2); font-size: 13px; }
.ev-import-source-remove:hover { background: var(--ev-surface-2); color: var(--ev-text); }
/* A picture that goes with a data file (crypt.json + crypt.png): one box, the link between them. */
.ev-import-pair { flex: 0 0 auto; display: flex; align-items: center; gap: 0; padding: 0; border: 1px solid var(--ev-line); border-radius: var(--ev-r-md); }
.ev-import-pair > .ev-import-source { border: 0; border-radius: var(--ev-r-md); }
.ev-import-pair-link { display: grid; place-items: center; width: 18px; color: var(--ev-text-2); font-size: 14px; }
.ev-import-add { flex: 0 0 auto; height: 44px; padding: 0 12px; border: 1px dashed var(--ev-line-strong); border-radius: var(--ev-r-md); background: transparent; color: var(--ev-text-2); font-size: 13px; font-weight: 600; --ev-pill-icon: 15px; }
.ev-import-add:hover { color: var(--ev-text); border-color: var(--ev-text-2); }

/* ----- What it was read as ----- */
.ev-import-read { flex: 0 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; margin: 0 22px; padding: 12px 0; border-top: 1px solid var(--ev-line); border-bottom: 1px solid var(--ev-line); }
.ev-sys-dnd5e .ev-import-read { border-top-color: var(--ev-gold); }
.frame.phone .ev-import-read { margin: 0 16px; grid-template-columns: auto minmax(0, 1fr); }
.ev-import-read-icon { grid-row: span 2; align-self: start; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--ev-surface-2); color: var(--ev-text); font-size: 20px; }
.ev-import-read-name { font: var(--ev-display-weight) 19px/1.15 var(--ev-font-display); font-variant: var(--ev-display-variant); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-import-read-sub { grid-column: 2; font-size: 13px; color: var(--ev-text-2); display: flex; flex-wrap: wrap; gap: 2px 0; align-items: center; }
.ev-import-read-sub > span:not(:last-child)::after { content: '·'; padding: 0 8px; }
.ev-import-read-sub > span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.ev-import-read-sub .ic { font-size: 13px; }
.ev-import-read-sub a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--ev-line-strong); }
.ev-import-read-tools { grid-column: 3; grid-row: 1 / span 2; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px 14px; align-items: center; }
.frame.phone .ev-import-read-tools, .ev-import.is-narrow .ev-import-read-tools { grid-column: 1 / -1; grid-row: auto; justify-content: flex-start; padding-top: 6px; }
.ev-import-as { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ev-text-2); }
.ev-import-select { appearance: none; height: 30px; padding: 0 28px 0 10px; border: 1px solid var(--ev-line-strong); border-radius: var(--ev-r-md); background: var(--ev-surface) no-repeat right 8px center / 12px; color: var(--ev-text); font: 600 13px/1 var(--ev-font-ui); }
.ev-import-switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.ev-import-switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--ev-line-strong); position: relative; margin: 0; cursor: pointer; transition: background .15s; }
.ev-import-switch input::after { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.ev-import-switch input:checked { background: var(--ev-accent); }
.ev-import-switch input:checked::after { transform: translateX(14px); background: var(--ev-on-accent); }
.ev-import-look { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px; margin-top: 6px; padding: 10px 12px; border-radius: var(--ev-r-md); background: var(--ev-chip-bg); font-size: 13px; }
.ev-import-look-title { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.ev-import-look ul { margin: 0; padding-left: 20px; }
button.ev-import-look-toggle { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border: 0; border-radius: var(--ev-r-sm); background: var(--ev-chip-bg); color: var(--ev-chip-text); font-size: 12.5px; font-weight: 600; --ev-pill-icon: 14px; }

/* ----- The body: start, a status card, the review, a custom review, done ----- */
.ev-import-body { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

/* Start: drop zone and paste box side by side; stacked when narrow. */
.ev-import-start { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 14px 16px; padding: 4px 22px 16px; }
.ev-import-drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 240px; padding: 24px; border: 2px dashed var(--ev-line-strong); border-radius: var(--ev-r-lg); background: var(--ev-surface-2); color: var(--ev-text); text-align: center; cursor: pointer; transition: border-color .12s, background .12s; }
.ev-import-drop:hover { border-color: var(--ev-text-2); }
.ev-import-drop-icon { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--ev-surface); border: 1px solid var(--ev-line); font-size: 30px; color: var(--ev-text); }
.ev-import-drop-title { font: var(--ev-display-weight) 24px/1.1 var(--ev-font-display); font-variant: var(--ev-display-variant); letter-spacing: .02em; }
.ev-import-drop-sub { font-size: 13px; color: var(--ev-text-2); }
.ev-import-choose { height: 36px; padding: 0 16px; border: 0; border-radius: var(--ev-r-md); background: var(--ev-accent); color: var(--ev-on-accent); font-size: 14px; font-weight: 700; --ev-pill-icon: 16px; }
.ev-import-choose:hover { background: var(--ev-accent-hover); }
.ev-import-pastebox { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.ev-import-label { font: var(--ev-display-weight) 13px/1 var(--ev-font-display); font-variant: var(--ev-display-variant); letter-spacing: .06em; text-transform: lowercase; color: var(--ev-text-2); display: flex; align-items: center; gap: 6px; }
.ev-import-label .ic { font-size: 14px; }
textarea.ev-import-paste { flex: 1 1 auto; min-height: 160px; width: 100%; resize: none; padding: 12px 14px; border: 1px solid var(--ev-line-strong); border-radius: var(--ev-r-lg); background: var(--ev-surface); color: var(--ev-text); font: 12.5px/1.55 ui-monospace, "SF Mono", Menlo, monospace; }
textarea.ev-import-paste::placeholder { color: var(--ev-text-2); font-family: var(--ev-font-ui); font-size: 14px; }
.ev-import-formats { grid-column: 1 / -1; font-size: 12.5px; color: var(--ev-text-2); line-height: 1.6; }
.ev-import-format { white-space: nowrap; }
.ev-import-formats b { font-weight: 600; color: var(--ev-text); }
.ev-import-formats a { color: var(--ev-text); text-decoration: none; border-bottom: 1px solid var(--ev-line-strong); white-space: nowrap; }
@container evi (max-width: 719px) {
	.ev-import-start { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; align-content: start; padding: 4px 16px 14px; }
	.ev-import-drop { min-height: 0; padding: 20px 16px; }
	textarea.ev-import-paste { min-height: 130px; }
}
/* No drag and drop on phones: the drop zone is a big Choose files button. */
.frame.phone .ev-import-drop { flex-direction: row; justify-content: flex-start; gap: 14px; padding: 16px; border-style: solid; border-width: 1px; text-align: left; }
.frame.phone .ev-import-drop-icon { width: 48px; height: 48px; font-size: 24px; }
.frame.phone .ev-import-drop-title { font-size: 20px; }

/* Dragging files over: the whole dialog is the target. */
.ev-import-drag { position: absolute; inset: 64px 12px 12px; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; border: 2px dashed var(--ev-accent); border-radius: var(--ev-r-lg); background: color-mix(in srgb, var(--ev-surface) 92%, transparent); pointer-events: none; }
.ev-import-drag .ev-import-drop-icon { width: 76px; height: 76px; font-size: 36px; background: var(--ev-accent); color: var(--ev-on-accent); border: 0; }
.ev-import-drag-title { font: var(--ev-display-weight) 26px/1.1 var(--ev-font-display); font-variant: var(--ev-display-variant); }
.ev-import-drag-sub { font-size: 13px; color: var(--ev-text-2); }

/* Status card: a link waiting, fetching, reading, an error. */
.ev-import-status { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px 22px; }
.ev-import-card { width: min(100%, 560px); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.ev-import-card-icon { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--ev-surface-2); border: 1px solid var(--ev-line); font-size: 26px; }
.ev-import-card-icon.is-bad { background: var(--ev-danger-bg); color: var(--ev-danger-text); border-color: transparent; }
.ev-import-card-title { font: 700 19px/1.3 var(--ev-font-ui); overflow-wrap: anywhere; }
.ev-import-card-text { font-size: 14px; color: var(--ev-text-2); max-width: 46ch; }
.ev-import-card-url { max-width: 100%; padding: 6px 10px; border-radius: var(--ev-r-sm); background: var(--ev-surface-2); font: 12.5px/1.4 ui-monospace, Menlo, monospace; color: var(--ev-text); overflow-wrap: anywhere; }
.ev-import-card-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 4px; }
.ev-import-btn { height: 36px; padding: 0 14px; border: 1px solid var(--ev-line-strong); border-radius: var(--ev-r-md); background: var(--ev-surface); color: var(--ev-text); font-size: 14px; font-weight: 600; --ev-pill-icon: 16px; }
.ev-import-btn:hover { background: var(--ev-surface-2); }
.ev-import-btn.is-main { background: var(--ev-accent); border-color: var(--ev-accent); color: var(--ev-on-accent); }
.ev-import-btn.is-main:hover { background: var(--ev-accent-hover); }
.ev-import-btn[disabled] { opacity: .65; cursor: default; }
.ev-import-spin { animation: evi-spin 0.9s linear infinite; }
@keyframes evi-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ev-import-spin { animation-duration: 3s; } }
.ev-import-status .ev-import-code { width: min(100%, 760px); max-height: 300px; }

/* ----- Review: the checklist (rail) beside the preview (detail) ----- */
.ev-import-review { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(280px, 34%) minmax(0, 1fr); }
.ev-import-rail { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--ev-line); }
.ev-import-tools { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 22px; border-bottom: 1px solid var(--ev-line); }
.frame.phone .ev-import-tools, .ev-import.is-narrow .ev-import-tools { padding: 10px 16px; }
.ev-import-all { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.ev-import-filter { flex: 1 1 auto; min-width: 0; height: 30px; padding: 0 8px 0 28px; border: 1px solid var(--ev-line); border-radius: var(--ev-r-md); background: var(--ev-surface) no-repeat 8px center / 14px; color: var(--ev-text); font: 13px var(--ev-font-ui); }
.ev-import-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 0 12px; }
.ev-import-group-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; width: 100%; height: 34px; padding: 0 14px 0 22px; border: 0; background: var(--ev-surface); color: var(--ev-text-2); text-align: left; }
.frame.phone .ev-import-group-head, .ev-import.is-narrow .ev-import-group-head { padding: 0 16px; }
.ev-import-group-title { font: var(--ev-display-weight) 13px/1 var(--ev-font-display); font-variant: var(--ev-display-variant); letter-spacing: .06em; text-transform: lowercase; color: var(--ev-text); }
.ev-import-group-count { font: 600 12px/1 var(--ev-font-num); color: var(--ev-text-2); }
.ev-import-group-caret { margin-left: auto; font-size: 14px; color: var(--ev-text-2); transition: transform .12s; }
.ev-import-group.is-closed .ev-import-group-caret { transform: rotate(-90deg); }
.ev-import-group.is-closed .ev-import-row { display: none; }
.ev-import-row { position: relative; display: grid; grid-template-columns: 20px 20px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 48px; padding: 5px 14px 5px 22px; cursor: pointer; }
.frame.phone .ev-import-row, .ev-import.is-narrow .ev-import-row { padding: 6px 16px; min-height: 56px; grid-template-columns: 22px 20px minmax(0, 1fr) auto; }
.ev-import-row:hover { background: var(--ev-surface-2); }
.ev-import-row.is-selected { background: var(--ev-now); box-shadow: inset 0 0 0 1px var(--ev-line-strong); }
.ev-import-row input[type="checkbox"], .ev-import-all input, .ev-import-detail-tick input, .ev-import-toggle-row input { appearance: none; width: 18px; height: 18px; margin: 0; border: 1.5px solid var(--ev-line-strong); border-radius: 4px; background: var(--ev-surface) no-repeat center / 12px; cursor: pointer; display: block; }
:is(.ev-import-row, .ev-import-all, .ev-import-detail-tick, .ev-import-toggle-row) input:checked { background-color: var(--ev-accent); border-color: var(--ev-accent); background-image: var(--evi-check); }
:is(.ev-import-row, .ev-import-all, .ev-import-detail-tick, .ev-import-toggle-row) input:indeterminate { background-color: var(--ev-accent); border-color: var(--ev-accent); background-image: var(--evi-minus); }
.ev-import-row-state { display: grid; place-items: center; width: 20px; height: 20px; font-size: 17px; color: var(--ev-text-2); }
.ev-import-row-icon { display: grid; place-items: center; font-size: 18px; color: var(--ev-text-2); }
.ev-import-row-text { min-width: 0; display: flex; flex-direction: column; }
.ev-import-row-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.ev-import-row-meta { font-size: 12.5px; color: var(--ev-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.ev-import-row.is-off .ev-import-row-name { color: var(--ev-text-2); }
.ev-import-row-end { display: flex; align-items: center; gap: 6px; color: var(--ev-text-2); }
.ev-import-row-end .is-look { color: var(--ev-text); font-size: 16px; }
.ev-import-row-go { display: none; font-size: 14px; }
.frame.phone .ev-import-row-go, .ev-import.is-narrow .ev-import-row-go { display: block; }

/* Tags: dark, white text (design study rule 14). */
.ev-import-tag { height: 20px; padding: 0 7px; border-radius: var(--ev-r-chip); background: var(--ev-accent); color: var(--ev-on-accent); font: 600 11.5px/normal var(--ev-font-ui); --ev-pill-icon: 11px; --ev-pill-gap: 4px; }

/* Detail: the record's head, tabs, then its preview, changes or source. */
.ev-import-detail { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--ev-bg); }
.ev-import-detail-head { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 12px 22px 10px; background: var(--ev-surface); border-bottom: 1px solid var(--ev-line); }
.frame.phone .ev-import-detail-head, .ev-import.is-narrow .ev-import-detail-head { padding: 10px 12px; flex-wrap: wrap; }
.ev-import-back { width: 34px; height: 34px; display: none; place-items: center; border: 0; border-radius: 999px; background: var(--ev-surface-2); color: var(--ev-text); font-size: 17px; }
.frame.phone .ev-import-back, .ev-import.is-narrow .ev-import-back { display: grid; }
.ev-import-detail-title { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; }
.ev-import-detail-name { font: var(--ev-name-style) var(--ev-name-weight) 20px/1.2 var(--ev-font-name); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-import-detail-meta { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ev-text-2); }
.ev-import-detail-tick { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.ev-import-step { display: flex; gap: 4px; }
.ev-import-step button { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--ev-line); border-radius: var(--ev-r-md); background: var(--ev-surface); color: var(--ev-text); font-size: 14px; }
.ev-import-step button[disabled] { opacity: .4; cursor: default; }
.ev-import-tabs { flex: 0 0 auto; display: flex; justify-content: center; padding: 10px 16px 0; }
.ev-import-seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 8px; background: var(--ev-chip-bg); }
.ev-import-seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--ev-text-2); font-size: 13px; font-weight: 600; --ev-pill-icon: 14px; }
.ev-import-seg button.is-on { background: var(--ev-surface); color: var(--ev-text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.ev-import-pane { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px 22px 22px; container-type: inline-size; }
.frame.phone .ev-import-pane, .ev-import.is-narrow .ev-import-pane { padding: 12px; }
.ev-import-pane > * { max-width: 680px; margin-left: auto; margin-right: auto; }
.ev-import-pane > * + * { margin-top: 12px; }
.ev-import-pane > .ev-import-paper > * + * { margin-top: 12px; }

/* Notes on a record: what's wrong, what to check, where it is. Full tint, no edge stripe. */
.ev-import-note { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; padding: 10px 12px; border-radius: var(--ev-r-md); background: var(--ev-surface-2); font-size: 13px; }
.ev-import-note > .ic { font-size: 17px; margin-top: 1px; }
.ev-import-note.is-look { background: var(--ev-chip-bg); }
.ev-import-note.is-bad { background: var(--ev-danger-bg); }
.ev-import-note.is-bad > .ic { color: var(--ev-danger-text); }
.ev-import-note-title { font-weight: 700; }
.ev-import-note ul { margin: 2px 0 0; padding-left: 18px; }
.ev-import-note-actions { grid-column: 2; display: flex; gap: 8px; margin-top: 4px; }
.ev-import-note .ev-import-btn { height: 30px; font-size: 13px; padding: 0 10px; }

/* The preview stand-ins: the plugin draws the real ones (see README). */
.ev-import-paper { max-width: 680px; }
.sb { border: 1px solid var(--ev-line-strong); border-radius: var(--ev-r-md); background: var(--ev-surface); padding: 14px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.sb-name { font: var(--ev-name-style) var(--ev-name-weight) 22px/1.15 var(--ev-font-name); display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.ev-sys-nimble .sb-name { font-variant: small-caps; }
.sb-sub { font: 700 12px/1 var(--ev-font-display); font-variant: small-caps; letter-spacing: .04em; color: var(--ev-text-2); font-style: normal; }
.sb-stats { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0 6px; font: 700 15px/1 var(--ev-font-num); }
.sb-stat { display: inline-flex; align-items: center; gap: 5px; }
.sb-stat .ic { font-size: 15px; }
.sb-stat.hp .ic { color: var(--ev-hp); }
.sb-band { margin: 8px -16px; padding: 8px 22px 8px 16px; background: var(--ev-band); color: var(--ev-band-text); font-size: 13.5px; }
.sb-band b { font-style: italic; }
.sb-band.is-blood { background: var(--ev-danger-bg); }
.sb ul { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }
.sb li + li { margin-top: 4px; }
.dice { display: inline-block; padding: 0 4px; border: 1px solid var(--ev-line-strong); border-radius: 3px; font: 600 13px/1.35 var(--ev-font-num); background: var(--ev-surface); }
.term { border-bottom: 1px dotted var(--ev-text-2); }
.npc { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; border: 1px solid var(--ev-line-strong); border-radius: var(--ev-r-md); background: var(--ev-surface); padding: 14px; }
@container (max-width: 420px) { .npc { grid-template-columns: 64px minmax(0, 1fr); } }
.npc-portrait { aspect-ratio: 1; border-radius: var(--ev-r-md); background: var(--ev-band); display: grid; place-items: center; font: var(--ev-name-style) var(--ev-name-weight) 30px/1 var(--ev-font-name); color: var(--ev-band-text); }
.npc-name { font: var(--ev-name-style) var(--ev-name-weight) 24px/1.1 var(--ev-font-name); }
.npc-role { font-size: 13px; color: var(--ev-text-2); margin: 2px 0 8px; }
.npc-facts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.npc-fact { height: 22px; padding: 0 8px; border-radius: var(--ev-r-chip); background: var(--ev-chip-bg); color: var(--ev-chip-text); font: 600 12px/normal var(--ev-font-ui); --ev-pill-icon: 12px; --ev-pill-gap: 5px; }
.npc dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; font-size: 13.5px; }
.npc dt { font: 700 12px/1.6 var(--ev-font-display); font-variant: small-caps; letter-spacing: .05em; color: var(--ev-text-2); }
.npc dd { margin: 0; }
.npc-body { grid-column: 1 / -1; padding-top: 10px; border-top: 1px solid var(--ev-line); font-size: 14px; }
.loc { border: 1px solid var(--ev-line-strong); border-radius: var(--ev-r-md); background: var(--ev-surface); overflow: hidden; }
.loc-banner { height: 92px; background: linear-gradient(160deg, #6f6a60, #3b3832); position: relative; }
.loc-head { padding: 12px 14px 0; }
.loc-kicker { display: flex; align-items: center; gap: 6px; font: 700 12px/1 var(--ev-font-display); font-variant: small-caps; letter-spacing: .06em; color: var(--ev-text-2); }
.loc-name { font: var(--ev-name-style) var(--ev-name-weight) 24px/1.15 var(--ev-font-name); margin-top: 4px; }
.loc-body { padding: 8px 14px 14px; font-size: 14px; }
.card-item { border: 1px solid var(--ev-line-strong); border-radius: var(--ev-r-md); background: var(--ev-surface); padding: 14px 16px; }
.card-item-kicker { font: 700 12px/1 var(--ev-font-display); font-variant: small-caps; letter-spacing: .06em; color: var(--ev-text-2); }
.card-item-name { font: var(--ev-name-style) var(--ev-name-weight) 22px/1.15 var(--ev-font-name); margin: 4px 0 8px; }
.card-item p { margin: 6px 0 0; font-size: 14px; }

/* Map: the picture with its pins, as the map block draws them; the key under it. */
.ev-import-map { position: relative; border-radius: var(--ev-r-md); overflow: hidden; border: 1px solid var(--ev-line-strong); background: #1d1b18; }
.ev-import-map img { display: block; width: 100%; height: auto; }
.ev-import-pin { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; border: 0; padding: 0; background: transparent; }
.ev-import-pin-label { height: 18px; min-width: 18px; padding: 0 5px; border-radius: 3px; background: #24211d; color: #fff; font: 700 11px/normal var(--ev-font-ui); display: inline-flex; align-items: center; justify-content: center; }
.ev-import-pin-dot { width: 22px; height: 22px; margin-top: 2px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #C8321E; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.ev-import-pin.is-on .ev-import-pin-label { background: #fff; color: #24211d; box-shadow: 0 0 0 2px #24211d; }
.ev-import-map-missing { aspect-ratio: 3 / 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; background: var(--ev-surface-2); color: var(--ev-text); text-align: center; border: 2px dashed var(--ev-line-strong); border-radius: var(--ev-r-md); }
.ev-import-map-missing .ev-import-card-icon { background: var(--ev-surface); }
.ev-import-key { display: grid; grid-template-columns: minmax(0, 1fr); border: 1px solid var(--ev-line); border-radius: var(--ev-r-md); background: var(--ev-surface); }
.ev-import-key-row { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 12px; font-size: 13.5px; border: 0; background: transparent; color: inherit; text-align: left; }
.ev-import-key-row + .ev-import-key-row { border-top: 1px solid var(--ev-line); }
.ev-import-key-row.is-on { background: var(--ev-now); }
.ev-import-key-row .ev-import-pin-label { margin-top: 1px; }
.ev-import-key-row b { display: block; }
.ev-import-key-row > div > span { color: var(--ev-text-2); }
.ev-import-map-opts { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; color: var(--ev-text-2); }

/* Changes: an update, field by field. */
.ev-import-diff { border: 1px solid var(--ev-line); border-radius: var(--ev-r-md); background: var(--ev-surface); overflow: hidden; }
.ev-import-diff-row { display: grid; grid-template-columns: minmax(90px, 0.6fr) minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 9px 12px; font-size: 13.5px; }
.ev-import-diff-row + .ev-import-diff-row { border-top: 1px solid var(--ev-line); }
.ev-import-diff-row.is-head { font: 700 12px/1.3 var(--ev-font-display); font-variant: small-caps; letter-spacing: .05em; color: var(--ev-text-2); background: var(--ev-surface-2); }
.ev-import-diff-field { font-weight: 600; }
.ev-import-diff-old { color: var(--ev-text-2); text-decoration: line-through; }
@container (max-width: 460px) {
	.ev-import-diff-row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
	.ev-import-diff-row.is-head { display: none; }
}

/* Source: the file's text, as code, with line numbers. Read-only; pasted text can be edited. */
.ev-import-code-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ev-import-code-file { display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1 var(--ev-font-ui); min-width: 0; }
.ev-import-code-file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-import-code-bar .ev-import-seg { margin-left: auto; }
.ev-import-code { overflow: auto; border: 1px solid var(--ev-line); border-radius: var(--ev-r-md); background: var(--ev-code-bg); font: 12.5px/1.6 ui-monospace, "SF Mono", Menlo, monospace; counter-reset: ln; text-align: left; }
.ev-import-code-line { display: grid; grid-template-columns: 44px minmax(0, 1fr); white-space: pre; }
.ev-import-code-line::before { counter-increment: ln; content: counter(ln); padding-right: 10px; text-align: right; color: var(--ev-text-2); opacity: .6; user-select: none; border-right: 1px solid var(--ev-line); margin-right: 10px; }
.ev-import-code-line.is-err { background: var(--ev-danger-bg); }
.ev-import-code-line.is-err::before { color: var(--ev-danger-text); opacity: 1; font-weight: 700; }
.ev-import-code-line.is-rec { background: var(--ev-now); }
.ev-import-code .k { color: var(--ev-text); font-weight: 600; }
.ev-import-code .s { color: var(--ev-text-2); }
.ev-import-code .n { color: var(--ev-text); }
.ev-import-code .p { color: var(--ev-text-2); opacity: .7; }

/* Custom reviews (D&D Beyond, a content pack): the importer's own body, in a readable column. */
.ev-import-custom { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px 22px 18px; }
.frame.phone .ev-import-custom { padding: 12px 16px; }
.ev-import-custom-col { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.ev-import-checklist { display: flex; flex-direction: column; border: 1px solid var(--ev-line); border-radius: var(--ev-r-md); background: var(--ev-surface); }
.ev-import-checklist .ev-import-row { padding: 6px 12px; }
.ev-import-checklist .ev-import-row + .ev-import-row { border-top: 1px solid var(--ev-line); }
.ev-import-section-title { font: var(--ev-display-weight) 16px/1.2 var(--ev-font-display); font-variant: var(--ev-display-variant); letter-spacing: .04em; color: var(--ev-accent-text); }
.ev-import-muted { font-size: 13px; color: var(--ev-text-2); }
.ev-import-toggle-row { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--ev-line); border-radius: var(--ev-r-md); background: var(--ev-surface); font-size: 14px; font-weight: 600; }
.ev-import-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.ev-import-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border: 1px solid var(--ev-line); border-radius: var(--ev-r-md); background: var(--ev-surface); }
.ev-import-tile b { font: 700 22px/1 var(--ev-font-num); }
.ev-import-tile span { font-size: 12.5px; color: var(--ev-text-2); }

/* Done. */
.ev-import-done { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 22px; }
.ev-import-done .ev-import-card-icon { background: var(--ev-accent); color: var(--ev-on-accent); border: 0; }
.ev-import-written { width: min(100%, 620px); border: 1px solid var(--ev-line); border-radius: var(--ev-r-md); background: var(--ev-surface); }
.ev-import-written-row { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; }
.ev-import-written-row + .ev-import-written-row { border-top: 1px solid var(--ev-line); }
.ev-import-written-row .ic { font-size: 18px; color: var(--ev-text-2); }
.ev-import-written-name { font-weight: 600; font-size: 14px; }
.ev-import-written-path { font-size: 12px; color: var(--ev-text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-import-open { height: 28px; padding: 0 10px; border: 1px solid var(--ev-line); border-radius: var(--ev-r-md); background: var(--ev-surface); color: var(--ev-text); font-size: 12.5px; font-weight: 600; --ev-pill-icon: 13px; }

/* Footer: Cancel left, the main action right (core/dialog.ts dialogFoot). */
.ev-dialog-foot { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 12px 22px; border-top: 1px solid var(--ev-line); background: var(--ev-surface); }
.frame.phone .ev-dialog-foot { padding: 10px 16px 26px; }
.ev-dialog-btn { height: 40px; padding: 0 18px; border-radius: var(--ev-r-md); border: 1px solid var(--ev-line-strong); background: var(--ev-surface); color: var(--ev-text); font-size: 15px; font-weight: 700; --ev-pill-icon: 17px; }
.ev-dialog-btn.is-cancel { margin-right: auto; }
.ev-dialog-btn.is-main { background: var(--ev-accent); border-color: var(--ev-accent); color: var(--ev-on-accent); min-width: 140px; }
.ev-dialog-btn.is-main[disabled] { opacity: .45; cursor: default; }
.ev-dialog-foot-hint { font-size: 12.5px; color: var(--ev-text-2); white-space: nowrap; }
.frame.phone .ev-dialog-foot .ev-dialog-btn { flex: 1 1 0; }
.frame.phone .ev-dialog-foot .ev-dialog-btn.is-main { flex-grow: 2; }
.frame.phone .ev-dialog-foot-hint { display: none; }

/* Narrow (the dialog under 720px wide, and phones): one column, the preview pushed over the list. */

	if (st === 'pasted') { row.append(sourceChip(FILES.pasted, { on: S.tab === 'source' }), add()); return row; }

function sourcePane(r) {
	const isPasted = r.id === 'lurker';
	const lines = isPasted ? 'creature: Marsh Lurker\nsize: Large\ntype: beast\nac: 15\nac_class: natural armor\nhp: 45\nhit_dice: 6d10 + 12\nspeed: 30 ft., swim 40 ft.\ncr: 3\ntraits:\n  - name: Hold Breath\n    desc: The lurker can hold its breath for 1 hour.\nactions:\n  - name: Multiattack\n    desc: The lurker makes one Bite and one Claw attack.\n  - name: Bite\n    desc: "Melee Weapon Attack: +5 to hit, reach 5 ft. 12 (2d8 + 3) piercing damage."'.split('\n') : BUNDLE_SRC.split('\n');
	const rec = recordLines[r.id];
	const bar = h('div', { cls: 'ev-import-code-bar' },
		h('span', { cls: 'ev-import-code-file' }, icon(isPasted ? 'clipboard-text' : 'file-code'), h('span', { text: isPasted ? 'Pasted text' : 'sunken-crypt.json' })),

		pill('button', { cls: 'ev-import-open', icon: 'copy', text: 'Copy' }));
	const shown = !isPasted && S.srcScope === 'record' && rec ? lines.slice(rec[0] - 1, rec[1]) : lines;
	const out = [];

	out.push(bar, code(shown, { rec: S.srcScope === 'file' ? rec : null }));

/* ---------- study controls ---------- */
const statesEl = document.getElementById('states');
for (const [id, t] of STATES) statesEl.append(h('button', { 'data-id': id, text: t, onclick: () => { setState(id); location.hash = `${id}/${S.view}`; } }));
const groupBtns = (elId, k, opts) => { const g = document.getElementById(elId); for (const [v, t] of opts) g.append(h('button', { 'data-k': k, 'data-v': v, text: t, onclick: () => { S[k] = v; if (k === 'view') S.detailOpen = S.detailOpen; render(); location.hash = `${S.state}/${S.view}`; } })); };
groupBtns('views', 'view', [['desktop', 'Desktop 1280'], ['window', 'Window 700'], ['phone', 'Phone 390']]);
groupBtns('games', 'game', [['nimble', 'Nimble'], ['dnd5e', '5e']]);
groupBtns('themes', 'theme', [['light', 'Light'], ['dark', 'Dark']]);
// #state/view[/detail][/dark][/5e] — the screenshot script drives the study through the hash.
function fromHash() {
	const [st, view, ...flags] = location.hash.slice(1).split('/');
	if (view) S.view = view;
	S.theme = flags.includes('dark') ? 'dark' : 'light';
	S.game = flags.includes('5e') ? 'dnd5e' : 'nimble';
	setState(STATES.some(s => s[0] === st) ? st : 'review');
	if (flags.includes('list')) { S.detailOpen = false; render(); }
	if (flags.includes('detail')) { S.detailOpen = true; render(); }
}
// Checkbox marks in the accent's opposite colour, light and dark.
for (const [k, ic] of [['check', 'check'], ['minus', 'minus']]) {
	document.body.parentElement.style.setProperty(`--evi-${k}-l`, svgUrl(ic, 'white'));
	document.body.parentElement.style.setProperty(`--evi-${k}-d`, svgUrl(ic, '%231B1916'));
}
